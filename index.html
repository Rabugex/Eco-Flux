<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="description" content="EcoFlux - Sistema de Limpeza Inteligente de Rios">
    <meta name="theme-color" content="#0f172a">
    <title>EcoFlux Dashboard - Minimalista</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1a2540 50%, #0f172a 100%);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            background: rgba(15, 23, 42, 0.7);
            border: 2px solid rgba(6, 182, 212, 0.3);
            border-radius: 20px;
            padding: 40px;
            backdrop-filter: blur(10px);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 50px;
            padding-bottom: 30px;
            border-bottom: 1px solid rgba(6, 182, 212, 0.2);
        }

        .header h1 {
            font-size: 32px;
            background: linear-gradient(135deg, #06b6d4 0%, #0ea5e9 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
        }

        .header-controls {
            display: flex;
            gap: 15px;
        }

        .btn {
            padding: 10px 20px;
            background: rgba(6, 182, 212, 0.1);
            border: 1px solid rgba(6, 182, 212, 0.3);
            color: #06b6d4;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: rgba(6, 182, 212, 0.2);
            border-color: rgba(6, 182, 212, 0.5);
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
        }

        /* BALDE */
        .balde-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .balde-container {
            position: relative;
            width: 200px;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .balde {
            width: 140px;
            height: 180px;
            background: linear-gradient(to right, rgba(6, 182, 212, 0.2), rgba(6, 182, 212, 0.1));
            border: 3px solid #06b6d4;
            clip-path: polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .balde-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(6, 182, 212, 0.4), transparent);
            clip-path: polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%);
            animation: fillWave 3s ease-in-out infinite;
        }

        @keyframes fillWave {
            0%, 100% { height: 57%; }
            50% { height: 59%; }
        }

        .percentual {
            position: absolute;
            right: -80px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 56px;
            font-weight: 700;
            color: #06b6d4;
            line-height: 1;
        }

        .balde-label {
            text-align: center;
            font-size: 14px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* CIRCULARES */
        .circulares {
            display: flex;
            gap: 40px;
            justify-content: center;
            width: 100%;
        }

        .circulo {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 2px solid #06b6d4;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 8px;
            background: rgba(6, 182, 212, 0.05);
            position: relative;
            overflow: hidden;
        }

        .circulo::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 30% 30%, rgba(6, 182, 212, 0.1), transparent);
            pointer-events: none;
        }

        .circulo-label {
            font-size: 12px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            z-index: 1;
        }

        .circulo-valor {
            font-size: 32px;
            font-weight: 700;
            color: #06b6d4;
            z-index: 1;
        }

        /* LADO DIREITO */
        .info-section {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .info-card {
            background: rgba(6, 182, 212, 0.05);
            border: 1px solid rgba(6, 182, 212, 0.2);
            border-radius: 12px;
            padding: 20px;
        }

        .info-card-label {
            font-size: 12px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        .info-card-value {
            font-size: 28px;
            font-weight: 700;
            color: #06b6d4;
        }

        .info-card-detail {
            font-size: 12px;
            color: #64748b;
            margin-top: 8px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(6, 182, 212, 0.1);
            border-radius: 3px;
            margin-top: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #06b6d4 0%, #0ea5e9 100%);
            width: 77%;
            border-radius: 3px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .dashboard {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            .percentual {
                position: static;
                transform: none;
                margin-top: 20px;
            }

            .header {
                flex-direction: column;
                gap: 20px;
            }

            .header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>EcoFlux</h1>
            <div class="header-controls">
                <button class="btn">Entrar</button>
                <button class="btn">Configurações</button>
            </div>
        </div>

        <div class="dashboard">
            <div class="balde-section">
                <div class="balde-container">
                    <div class="balde">
                        <div class="balde-fill"></div>
                    </div>
                    <div class="percentual">57%</div>
                </div>
                <div class="balde-label">Nível do Balde</div>

                <div class="circulares">
                    <div class="circulo">
                        <div class="circulo-label">Bomba</div>
                        <div class="circulo-valor">OFF</div>
                    </div>
                    <div class="circulo">
                        <div class="circulo-label">Tempo</div>
                        <div class="circulo-valor">1.0h</div>
                    </div>
                </div>
            </div>

            <div class="info-section">
                <div class="info-card">
                    <div class="info-card-label">Nível da Bateria</div>
                    <div class="info-card-value">77%</div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 77%;"></div>
                    </div>
                    <div class="info-card-detail">Carregada</div>
                </div>

                <div class="info-card">
                    <div class="info-card-label">Tensão</div>
                    <div class="info-card-value">12.5V</div>
                    <div class="info-card-detail">Normal</div>
                </div>

                <div class="info-card">
                    <div class="info-card-label">Próxima Manutenção</div>
                    <div class="info-card-value">-</div>
                    <div class="info-card-detail">Sem agendamento</div>
                </div>

                <div class="info-card">
                    <div class="info-card-label">Status Geral</div>
                    <div class="info-card-value" style="color: #10b981;">BOM</div>
                    <div class="info-card-detail">Tudo funcionando normalmente</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
