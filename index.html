<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="description" content="EcoFlux - Sistema de Limpeza Inteligente de Rios">
    <meta name="theme-color" content="#0f172a">
    <title>EcoFlux Dashboard - Minimalista</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1a2540 50%, #0f172a 100%);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            width: 100%;
            background: rgba(15, 23, 42, 0.7);
            border: 2px solid rgba(6, 182, 212, 0.3);
            border-radius: 20px;
            padding: 40px;
            backdrop-filter: blur(10px);
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .header h1 {
            font-size: 32px;
            background: linear-gradient(135deg, #06b6d4 0%, #0ea5e9 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 40px;
            align-items: flex-start;
        }

        /* COLUNA 1: BALDE */
        .balde-section {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .balde-container {
            display: flex;
            align-items: flex-start;
            gap: 30px;
        }

        .balde {
            width: 120px;
            height: 140px;
            background: linear-gradient(to right, rgba(6, 182, 212, 0.3), rgba(6, 182, 212, 0.1));
            border: 2px solid #06b6d4;
            clip-path: polygon(15% 0%, 85% 0%, 100% 100%, 0% 100%);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            position: relative;
            flex-shrink: 0;
        }

        .balde-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(6, 182, 212, 0.5), transparent);
            clip-path: polygon(15% 0%, 85% 0%, 100% 100%, 0% 100%);
            animation: fillWave 3s ease-in-out infinite;
            height: 57%;
        }

        @keyframes fillWave {
            0%, 100% { height: 57%; }
            50% { height: 59%; }
        }

        .percentual-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .percentual {
            font-size: 48px;
            font-weight: 700;
            color: #06b6d4;
            line-height: 1;
        }

        .progress-bar {
            width: 280px;
            height: 6px;
            background: rgba(6, 182, 212, 0.2);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #06b6d4 0%, #0ea5e9 100%);
            width: 57%;
            border-radius: 3px;
        }

        /* COLUNA 2: BATERIA E TENSÃO */
        .info-section {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .info-pill {
            background: rgba(6, 182, 212, 0.1);
            border: 1px solid rgba(6, 182, 212, 0.3);
            border-radius: 20px;
            padding: 20px 25px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .info-label {
            font-size: 12px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-value {
            font-size: 32px;
            font-weight: 700;
            color: #06b6d4;
        }

        .info-detail {
            font-size: 12px;
            color: #64748b;
        }

        .battery-progress {
            width: 100%;
            height: 5px;
            background: rgba(6, 182, 212, 0.1);
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
        }

        .battery-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #06b6d4 0%, #0ea5e9 100%);
            width: 77%;
            border-radius: 2px;
        }

        /* COLUNA 3: CIRCULARES */
        .circulares {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .circulo {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 2px solid #06b6d4;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 8px;
            background: rgba(6, 182, 212, 0.05);
            position: relative;
            overflow: hidden;
        }

        .circulo::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 30% 30%, rgba(6, 182, 212, 0.1), transparent);
            pointer-events: none;
        }

        .circulo-label {
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            z-index: 1;
        }

        .circulo-valor {
            font-size: 32px;
            font-weight: 700;
            color: #06b6d4;
            z-index: 1;
        }

        @media (max-width: 1200px) {
            .dashboard {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            .balde-container {
                justify-content: center;
            }

            .circulares {
                flex-direction: row;
                justify-content: center;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .header h1 {
                font-size: 24px;
            }

            .dashboard {
                grid-template-columns: 1fr;
            }

            .balde {
                width: 100px;
                height: 120px;
            }

            .progress-bar {
                width: 200px;
            }

            .circulo {
                width: 140px;
                height: 140px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>EcoFlux</h1>
        </div>

        <div class="dashboard">
            <!-- COLUNA 1: BALDE -->
            <div class="balde-section">
                <div class="balde-container">
                    <div class="balde">
                        <div class="balde-fill"></div>
                    </div>
                    <div class="percentual-display">
                        <div class="percentual">57%</div>
                        <div class="progress-bar">
                            <div class="progress-fill"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- COLUNA 2: BATERIA E TENSÃO -->
            <div class="info-section">
                <div class="info-pill">
                    <div class="info-label">Nível da Bateria</div>
                    <div class="info-value">77%</div>
                    <div class="battery-progress">
                        <div class="battery-progress-fill"></div>
                    </div>
                    <div class="info-detail">Carregada</div>
                </div>

                <div class="info-pill">
                    <div class="info-label">Tensão</div>
                    <div class="info-value">12.5V</div>
                    <div class="info-detail">Normal</div>
                </div>
            </div>

            <!-- COLUNA 3: CIRCULARES -->
            <div class="circulares">
                <div class="circulo">
                    <div class="circulo-label">Bomba</div>
                    <div class="circulo-valor">OFF</div>
                </div>
                <div class="circulo">
                    <div class="circulo-label">Tempo</div>
                    <div class="circulo-valor">1.0h</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
