<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="description" content="EcoFlux - Sistema de Limpeza Inteligente de Rios">
    <meta name="theme-color" content="#0f172a">
    <title>EcoFlux Dashboard - Glassmorphism</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #e0f7ff 0%, #f0e7ff 50%, #e8f5ff 100%);
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .header h1 {
            font-size: 48px;
            background: linear-gradient(135deg, #0ea5e9 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 30px;
            align-items: flex-start;
        }

        /* COLUNA 1: BALDE */
        .balde-section {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .balde-container {
            display: flex;
            align-items: flex-start;
            gap: 25px;
        }

        .balde {
            width: 120px;
            height: 140px;
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.2), rgba(14, 165, 233, 0.1));
            border: 2px solid rgba(14, 165, 233, 0.5);
            clip-path: polygon(15% 0%, 85% 0%, 100% 100%, 0% 100%);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            position: relative;
            flex-shrink: 0;
            backdrop-filter: blur(10px);
        }

        .balde-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(14, 165, 233, 0.6), transparent);
            clip-path: polygon(15% 0%, 85% 0%, 100% 100%, 0% 100%);
            animation: fillWave 3s ease-in-out infinite;
            height: 57%;
        }

        @keyframes fillWave {
            0%, 100% { height: 57%; }
            50% { height: 59%; }
        }

        .percentual-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .percentual {
            font-size: 48px;
            font-weight: 700;
            background: linear-gradient(135deg, #0ea5e9 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }

        .progress-bar {
            width: 280px;
            height: 6px;
            background: rgba(14, 165, 233, 0.2);
            border-radius: 3px;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #0ea5e9 0%, #a855f7 100%);
            width: 57%;
            border-radius: 3px;
        }

        /* COLUNA 2: BATERIA E TENSÃO */
        .info-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .glass-pill {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .glass-pill:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
            background: rgba(255, 255, 255, 0.8);
        }

        .glass-label {
            font-size: 11px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .glass-value {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #0ea5e9 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .glass-detail {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 5px;
        }

        .battery-progress {
            width: 100%;
            height: 5px;
            background: rgba(14, 165, 233, 0.2);
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
        }

        .battery-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #0ea5e9 0%, #a855f7 100%);
            width: 77%;
            border-radius: 2px;
        }

        /* COLUNA 3: CIRCULARES */
        .circulares {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .glass-circle {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .glass-circle:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
            background: rgba(255, 255, 255, 0.8);
        }

        .circle-label {
            font-size: 11px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .circle-value {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #0ea5e9 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        @media (max-width: 1200px) {
            .dashboard {
                grid-template-columns: 1fr;
                gap: 25px;
            }

            .balde-container {
                justify-content: center;
            }

            .circulares {
                flex-direction: row;
                justify-content: center;
            }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 32px;
            }

            .dashboard {
                grid-template-columns: 1fr;
            }

            .balde {
                width: 100px;
                height: 120px;
            }

            .progress-bar {
                width: 200px;
            }

            .glass-circle {
                width: 140px;
                height: 140px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>EcoFlux</h1>
        </div>

        <div class="dashboard">
            <!-- COLUNA 1: BALDE -->
            <div class="balde-section">
                <div class="balde-container">
                    <div class="balde">
                        <div class="balde-fill"></div>
                    </div>
                    <div class="percentual-display">
                        <div class="percentual">57%</div>
                        <div class="progress-bar">
                            <div class="progress-fill"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- COLUNA 2: BATERIA E TENSÃO -->
            <div class="info-section">
                <div class="glass-pill">
                    <div class="glass-label">Nível da Bateria</div>
                    <div class="glass-value">77%</div>
                    <div class="battery-progress">
                        <div class="battery-progress-fill"></div>
                    </div>
                    <div class="glass-detail">Carregada</div>
                </div>

                <div class="glass-pill">
                    <div class="glass-label">Tensão</div>
                    <div class="glass-value">12.5V</div>
                    <div class="glass-detail">Normal</div>
                </div>
            </div>

            <!-- COLUNA 3: CIRCULARES -->
            <div class="circulares">
                <div class="glass-circle">
                    <div class="circle-label">Bomba</div>
                    <div class="circle-value">OFF</div>
                </div>
                <div class="glass-circle">
                    <div class="circle-label">Tempo</div>
                    <div class="circle-value">1.0h</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
