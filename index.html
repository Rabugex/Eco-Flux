<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="description" content="EcoFlux - Sistema de Limpeza Inteligente de Rios">
    <meta name="theme-color" content="#0f172a">
    <title>EcoFlux Dashboard - Glassmorphism</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #e0f7ff 0%, #f0e7ff 50%, #e8f5ff 100%);
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            backdrop-filter: blur(20px);
        }

        .container {
            max-width: 1400px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .header h1 {
            font-size: 48px;
            background: linear-gradient(135deg, #0ea5e9 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 16px;
            color: #64748b;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 15px;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.320, 1);
            position: relative;
            overflow: hidden;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0));
            pointer-events: none;
        }

        .glass-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.15);
            background: rgba(255, 255, 255, 0.8);
        }

        .glass-label {
            font-size: 13px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            position: relative;
            z-index: 1;
        }

        .glass-value {
            font-size: 45px;
            font-weight: 700;
            background: linear-gradient(135deg, #0ea5e9 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
            z-index: 1;
            line-height: 1;
        }

        .glass-detail {
            font-size: 12px;
            color: #94a3b8;
            position: relative;
            z-index: 1;
            margin-top: 5px;
        }

        .progress-container {
            position: relative;
            z-index: 1;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(100, 116, 139, 0.2);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #0ea5e9 0%, #a855f7 100%);
            border-radius: 4px;
            transition: width 0.6s cubic-bezier(0.23, 1, 0.320, 1);
        }

        .featured-card {
            grid-column: span 2;
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.15), rgba(168, 85, 247, 0.15));
        }

        .featured-card .glass-value {
            font-size: 60px;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-top: 40px;
            justify-content: center;
        }

        .btn {
            padding: 12px 30px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            color: #1e293b;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            transform: translateY(-2px);
        }

        .btn-primary {
            background: linear-gradient(135deg, #0ea5e9 0%, #a855f7 100%);
            color: white;
            border: none;
        }

        .btn-primary:hover {
            box-shadow: 0 12px 24px rgba(14, 165, 233, 0.3);
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 32px;
            }

            .dashboard {
                grid-template-columns: 1fr;
            }

            .featured-card {
                grid-column: span 1 !important;
            }

            .glass-value {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>EcoFlux</h1>
            <p>Sistema de Limpeza Inteligente de Rios</p>
        </div>

        <div class="dashboard">
            <div class="glass-card featured-card">
                <div class="glass-label">Nível do Balde</div>
                <div class="glass-value">57%</div>
                <div class="progress-container">
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 57%;"></div>
                    </div>
                </div>
                <div class="glass-detail">Em tempo real</div>
            </div>

            <div class="glass-card">
                <div class="glass-label">Nível Bateria</div>
                <div class="glass-value">77%</div>
                <div class="progress-container">
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 77%;"></div>
                    </div>
                </div>
                <div class="glass-detail">Carregada</div>
            </div>

            <div class="glass-card">
                <div class="glass-label">Tensão</div>
                <div class="glass-value">12.5V</div>
                <div class="glass-detail">Normal</div>
            </div>

            <div class="glass-card">
                <div class="glass-label">Bomba</div>
                <div class="glass-value" style="color: #ef4444;">OFF</div>
                <div class="glass-detail">Desligada</div>
            </div>

            <div class="glass-card">
                <div class="glass-label">Tempo Total</div>
                <div class="glass-value">1.00h</div>
                <div class="glass-detail">Horas operacionais</div>
            </div>

            <div class="glass-card">
                <div class="glass-label">Próxima Manutenção</div>
                <div class="glass-value">-</div>
                <div class="glass-detail">Sem agendamento</div>
            </div>
        </div>

        <div class="controls">
            <button class="btn">Configurações</button>
            <button class="btn btn-primary">Ligar Bomba</button>
            <button class="btn">Sair</button>
        </div>
    </div>
</body>
</html>
